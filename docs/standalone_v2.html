    const blobUrls = {};

            const reader = ds.readable.getReader();

    }

    console.error('Bundle unpack error:', err);

'woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Onest';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"8ef92905-8bfb-46ce-838b-90f668c18d31\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Onest';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ac1c74f7-2933-4199-912c-029ddbbb7aae\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ===================================================================\n   RedStaff Этап 2 — сайт-предложение\n   Red Petroleum palette: red + black + white + light grey\n   Typography: Onest + JetBrains Mono\n   =================================================================== */\n\n:root {\n  --bg: #FFFFFF;\n  --bg-2: #F6F6F6;\n  --bg-3: #EFEFEF;\n  --ink: #0B0B0C;\n  --ink-2: #3A3A3D;\n  --ink-3: #6B6B70;\n  --ink-4: #A8A8AD;\n  --line: #E5E5E7;\n  --line-2: #D1D1D5;\n\n  --rp-red: #E30613;          /* primary brand red */\n  --rp-red-2: #B30410;        /* darker */\n  --rp-red-soft: #FCE7E9;     /* tinted bg */\n  --rp-black: #0B0B0C;\n  --rp-yellow: #FFC700;       /* very sparing accent */\n\n  --sans: \"Onest\", -apple-system, system-ui, \"Segoe UI\", sans-serif;\n  --mono: \"JetBrains Mono\", ui-monospace, monospace;\n\n  --container: 1440px;\n  --pad-x: clamp(20px, 5vw, 96px);\n  --pad-y: clamp(80px, 10vw, 160px);\n}\n\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 17px;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nimg, svg { display: block; max-width: 100%; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }\n\n/* ====================== LAYOUT ====================== */\n.wrap {\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: var(--pad-x);\n  padding-right: var(--pad-x);\n  position: relative;\n}\n.section {\n  padding-top: var(--pad-y);\n  padding-bottom: var(--pad-y);\n  position: relative;\n}\n.section.dark {\n  background: var(--rp-black);\n  color: #fff;\n}\n.section.gray { background: var(--bg-2); }\n\n/* ====================== TYPOGRAPHY ====================== */\n.eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--rp-red);\n  font-weight: 500;\n  margin: 0 0 28px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 8px; height: 8px;\n  background: var(--rp-red);\n  display: inline-block;\n}\n.dark .eyebrow { color: #fff; }\n.dark .eyebrow::before { background: var(--rp-red); }\n\n.h-display {\n  font-family: var(--sans);\n  font-weight: 700;\n  font-size: clamp(48px, 7.5vw, 116px);\n  line-height: 0.96;\n  letter-spacing: -0.035em;\n  margin: 0;\n  text-wrap: balance;\n}\n.h-display em { font-style: normal; color: var(--rp-red); }\n.h-section {\n  font-family: var(--sans);\n  font-weight: 700;\n  font-size: clamp(40px, 5.5vw, 80px);\n  line-height: 1.0;\n  letter-spacing: -0.025em;\n  margin: 0 0 32px;\n  text-wrap: balance;\n}\n.h-section em { font-style: normal; color: var(--rp-red); }\n.h-block {\n  font-family: var(--sans);\n  font-weight: 600;\n  font-size: clamp(28px, 3vw, 40px);\n  line-height: 1.1;\n  letter-spacing: -0.02em;\n  margin: 0;\n}\n.lede {\n  font-family: var(--sans);\n  font-weight: 400;\n  font-size: clamp(20px, 1.8vw, 26px);\n  line-height: 1.4;\n  color: var(--ink-2);\n  margin: 0;\n  max-width: 880px;\n  text-wrap: pretty;\n}\n.dark .lede { color: rgba(255,255,255,0.78); }\n.body {\n  font-size: 17px;\n  line-height: 1.6;\n  color: var(--ink-2);\n  max-width: 720px;\n}\n.dark .body { color: rgba(255,255,255,0.72); }\n.mono {\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n.dark .mono { color: rgba(255,255,255,0.5); }\n\n.section-id {\n  display: flex;\n  align-items: baseline;\n  gap: 14px;\n  margin-bottom: 24px;\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n}\n.dark .section-id { color: rgba(255,255,255,0.5); }\n.section-id .num { color: var(--rp-red); font-weight: 600; }\n.section-id .bar {\n  width: 56px; height: 1px;\n  background: var(--line-2);\n}\n.dark .section-id .bar { background: rgba(255,255,255,0.2); }\n\n/* ====================== NAV ====================== */\n.nav {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 100;\n  padding: 14px 0;\n  background: rgba(255,255,255,0.85);\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n  border-bottom: 1px solid transparent;\n  transition: background 200ms ease, border-color 200ms ease;\n}\n.nav.scrolled { border-bottom-color: var(--line); }\n.nav .wrap {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n}\n.nav-brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  font-family: var(--mono);\n  font-size: 13px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--ink);\n}\n.nav-brand .mark {\n  width: 28px; height: 28px;\n  background: var(--rp-red);\n  border-radius: 5px;\n  display: flex; align-items: center; justify-content: center;\n  color: #fff;\n  font-family: var(--sans);\n  font-weight: 700;\n  font-size: 16px;\n  letter-spacing: 0;\n}\n.nav-links {\n  display: flex;\n  gap: 32px;\n  font-size: 14px;\n  color: var(--ink-2);\n}\n.nav-links a {\n  position: relative;\n  padding: 6px 0;\n  transition: color 150ms ease;\n}\n.nav-links a:hover { color: var(--rp-red); }\n.nav-cta {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  background: var(--rp-red);\n  color: #fff;\n  padding: 10px 18px;\n  border-radius: 999px;\n  font-size: 14px;\n  font-weight: 500;\n  letter-spacing: 0.01em;\n  transition: background 150ms ease, transform 150ms ease;\n}\n.nav-cta:hover { background: var(--rp-red-2); transform: translateY(-1px); }\n.nav-cta .arr {\n  display: inline-block;\n  transition: transform 200ms ease;\n}\n.nav-cta:hover .arr { transform: translateX(3px); }\n\n@media (max-width: 900px) {\n  .nav-links { display: none; }\n}\n\n/* ====================== HERO ====================== */\n.hero {\n  background: var(--rp-black);\n  color: #fff;\n  padding-top: 180px;\n  padding-bottom: 80px;\n  position: relative;\n  overflow: hidden;\n}\n.hero::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(800px 600px at 80% 20%, rgba(227,6,19,0.25), transparent 60%),\n    radial-gradient(600px 500px at 10% 100%, rgba(227,6,19,0.15), transparent 60%);\n  pointer-events: none;\n}\n.hero .wrap { position: relative; z-index: 1; }\n.hero .top-row {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.55);\n  margin-bottom: 80px;\n}\n.hero .top-row .mark-row {\n  display: flex; align-items: center; gap: 14px;\n}\n.hero .top-row .mark-row .dot {\n  width: 6px; height: 6px; background: var(--rp-red); border-radius: 50%;\n}\n.hero h1.h-display {\n  color: #fff;\n  font-size: clamp(56px, 9vw, 144px);\n  font-weight: 700;\n}\n.hero h1 em { color: var(--rp-red); }\n.hero .hero-lede {\n  margin-top: 40px;\n  max-width: 760px;\n  font-size: clamp(20px, 1.7vw, 26px);\n  line-height: 1.4;\n  color: rgba(255,255,255,0.78);\n}\n.hero-meta {\n  margin-top: 100px;\n  display: grid;\n  grid-template-columns: repeat(3, 1fr) auto;\n  gap: 32px;\n  align-items: end;\n  padding-top: 40px;\n  border-top: 1px solid rgba(255,255,255,0.12);\n}\n.hero-meta .cell .l {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.5);\n  margin-bottom: 12px;\n}\n.hero-meta .cell .v {\n  font-size: clamp(36px, 4vw, 56px);\n  font-weight: 700;\n  letter-spacing: -0.025em;\n  line-height: 1;\n  color: #fff;\n}\n.hero-meta .cell .v em { color: var(--rp-red); font-style: normal; }\n.hero-meta .cta-cell { text-align: right; }\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  padding: 18px 28px;\n  border-radius: 999px;\n  font-size: 16px;\n  font-weight: 500;\n  transition: background 150ms ease, transform 150ms ease;\n  cursor: pointer;\n  white-space: nowrap;\n}\n.btn-primary {\n  background: var(--rp-red);\n  color: #fff;\n}\n.btn-primary:hover { background: var(--rp-red-2); transform: translateY(-2px); }\n.btn-ghost {\n  background: transparent;\n  color: #fff;\n  border: 1px solid rgba(255,255,255,0.25);\n}\n.btn-ghost:hover { background: rgba(255,255,255,0.08); }\n.btn-dark {\n  background: var(--rp-black);\n  color: #fff;\n}\n.btn-dark:hover { background: #1d1d1f; }\n.btn .arr {\n  display: inline-block;\n  transition: transform 200ms ease;\n}\n.btn:hover .arr { transform: translateX(4px); }\n\n@media (max-width: 900px) {\n  .hero-meta { grid-template-columns: 1fr 1fr; }\n  .hero-meta .cta-cell { grid-column: 1 / -1; text-align: left; margin-top: 16px; }\n}\n\n/* ====================== HEADER ROW (section intros) ====================== */\n.section-head {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 60px;\n  align-items: end;\n  margin-bottom: 80px;\n}\n.section-head .right { padding-bottom: 12px; }\n@media (max-width: 900px) {\n  .section-head { grid-template-columns: 1fr; gap: 24px; }\n}\n\n/* ====================== CARDS ====================== */\n.card {\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: 16px;\n  padding: 32px;\n  transition: border-color 200ms ease, transform 200ms ease, box-shadow 200ms ease;\n}\n.card.hover-lift:hover {\n  transform: translateY(-4px);\n  border-color: var(--line-2);\n  box-shadow: 0 24px 60px -28px rgba(11, 11, 12, 0.18);\n}\n.dark .card { background: #131315; border-color: rgba(255,255,255,0.08); color: #fff; }\n.dark .card.hover-lift:hover { border-color: rgba(255,255,255,0.18); }\n\n.card-red {\n  background: var(--rp-red);\n  color: #fff;\n  border-color: var(--rp-red);\n}\n.card-red .mono { color: rgba(255,255,255,0.72); }\n\n/* ====================== TIMELINE (context) ====================== */\n.timeline {\n  position: relative;\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 24px;\n}\n.timeline .tl-line {\n  position: absolute;\n  left: 28px; right: 28px;\n  top: 22px;\n  height: 2px;\n  background: var(--line-2);\n  z-index: 0;\n}\n.dark .timeline .tl-line { background: rgba(255,255,255,0.15); }\n.tl-item {\n  position: relative;\n  padding-top: 64px;\n}\n.tl-item .tl-dot {\n  position: absolute;\n  left: 0; top: 8px;\n  width: 28px; height: 28px;\n  border-radius: 50%;\n  background: var(--bg);\n  border: 2px solid var(--line-2);\n  z-index: 1;\n}\n.dark .tl-item .tl-dot { background: var(--rp-black); border-color: rgba(255,255,255,0.2); }\n.tl-item .tl-dot.done { background: var(--ink); border-color: var(--ink); }\n.dark .tl-item .tl-dot.done { background: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.4); }\n.tl-item .tl-dot.now {\n  background: var(--rp-red);\n  border-color: var(--rp-red);\n  box-shadow: 0 0 0 6px var(--rp-red-soft);\n}\n.dark .tl-item .tl-dot.now { box-shadow: 0 0 0 6px rgba(227,6,19,0.2); }\n.tl-item .tl-date {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  margin-bottom: 10px;\n}\n.tl-item .tl-title {\n  font-size: 26px;\n  font-weight: 600;\n  line-height: 1.15;\n  letter-spacing: -0.015em;\n  margin-bottom: 10px;\n}\n.tl-item .tl-body { font-size: 15px; color: var(--ink-3); line-height: 1.55; }\n\n@media (max-width: 900px) {\n  .timeline { grid-template-columns: 1fr; }\n  .timeline .tl-line { left: 14px; top: 32px; bottom: 32px; width: 2px; height: auto; right: auto; }\n}\n\n/* ====================== HUB DIAGRAM ====================== */\n.hub-wrap {\n  position: relative;\n  aspect-ratio: 5 / 3;\n  width: 100%;\n  max-width: 720px;\n}\n.hub-center {\n  position: absolute;\n  left: 50%; top: 50%;\n  transform: translate(-50%, -50%);\n  width: clamp(180px, 24%, 240px);\n  aspect-ratio: 1;\n  border-radius: 50%;\n  background: var(--rp-red);\n  color: #fff;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: 18px;\n  box-shadow:\n    0 30px 80px -20px rgba(227, 6, 19, 0.5),\n    inset 0 0 0 1px rgba(255,255,255,0.1);\n  z-index: 3;\n}\n.hub-center .lbl {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.7);\n}\n.hub-center .nm {\n  font-size: clamp(24px, 3.5vw, 38px);\n  font-weight: 700;\n  letter-spacing: -0.02em;\n  line-height: 1;\n  margin: 6px 0;\n}\n.hub-center .sub {\n  font-size: 12px;\n  color: rgba(255,255,255,0.78);\n  line-height: 1.4;\n}\n.hub-ring {\n  position: absolute;\n  left: 50%; top: 50%;\n  width: 65%;\n  aspect-ratio: 1;\n  border: 1px dashed var(--line-2);\n  border-radius: 50%;\n  transform: translate(-50%, -50%);\n  z-index: 1;\n}\n.dark .hub-ring { border-color: rgba(255,255,255,0.15); }\n.hub-svg {\n  pos ine-height: 1.5;\n  border-radius: 0 6px 6px 0;\n}\n\n@media (max-width: 1100px) {\n  .simulator { grid-template-columns: 1fr; gap: 36px; padding: 32px; }\n}\n\n/* ====================== Почему ASYSTEM — 6 cards ====================== */\n.why-grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 16px;\n}\n.why-card {\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  padding: 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  transition: border-color 200ms, transform 200ms;\n}\n.why-card:hover { border-color: var(--rp-red); transform: translateY(-3px); }\n.why-card .wn {\n  font-family: var(--mono);\n  font-size: 14px;\n  font-weight: 700;\n  color: var(--rp-red);\n  letter-spacing: 0.04em;\n}\n.why-card .wt { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }\n.why-card .wb { font-size: 14.5px; color: var(--ink-3); line-height: 1.55; }\n\n@media (max-width: 1100px) { .why-grid { grid-template-columns: 1fr 1fr; } }\n@media (max-width: 700px) { .why-grid { grid-template-columns: 1fr; } }\n\n/* ====================== Final CTA ====================== */\n.cta-final {\n  background: var(--rp-black);\n  color: #fff;\n  border-radius: 24px;\n  padding: 80px;\n  text-align: center;\n  position: relative;\n  overflow: hidden;\n}\n.cta-final::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(600px 400px at 20% 0%, rgba(227,6,19,0.25), transparent 60%),\n    radial-gradient(500px 400px at 80% 100%, rgba(227,6,19,0.18), transparent 60%);\n  pointer-events: none;\n}\n.cta-final .inner { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; }\n.cta-final h2 { font-size: clamp(40px, 6vw, 80px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.05; margin: 0 0 24px; color: #fff; }\n.cta-final h2 em { color: var(--rp-red); font-style: normal; }\n.cta-final p { font-size: 19px; color: rgba(255,255,255,0.75); line-height: 1.5; max-width: 640px; margin: 0 auto 48px; }\n.cta-channels {\n  display: flex;\n  gap: 16px;\n  justify-content: center;\n  flex-wrap: wrap;\n}\n.cta-channels a {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  padding: 18px 28px;\n  border-radius: 999px;\n  border: 1px solid rgba(255,255,255,0.2);\n  font-size: 15px;\n  transition: background 200ms, border-color 200ms, transform 200ms;\n}\n.cta-channels a:hover {\n  background: rgba(255,255,255,0.06);\n  border-color: var(--rp-red);\n  transform: translateY(-2px);\n}\n.cta-channels a.primary {\n  background: var(--rp-red);\n  border-color: var(--rp-red);\n}\n.cta-channels a.primary:hover { background: var(--rp-red-2); }\n.cta-channels .l {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.55);\n}\n.cta-channels a.primary .l { color: rgba(255,255,255,0.78); }\n.cta-channels .v { font-size: 16px; font-weight: 500; color: #fff; }\n\n@media (max-width: 900px) {\n  .cta-final { padding: 48px 24px; border-radius: 16px; }\n  .cta-channels { flex-direction: column; align-items: stretch; }\n}\n\n/* status pill for module D */\n.status-pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  background: rgba(255,199,0,0.15);\n  color: var(--rp-yellow);\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  padding: 6px 14px;\n  border-radius: 999px;\n  font-weight: 600;\n}\n.status-pill::before {\n  content: \"\";\n  width: 6px; height: 6px;\n  background: var(--rp-yellow);\n  border-radius: 50%;\n}\n\n/* Reveal fallback: if JS doesn't run within 2s, show */\n.no-js .reveal { opacity: 1; transform: none; }\n\n/* ===================================================================\n   EDITORIAL LAYER — long-form dossier structure\n   Breaks the SaaS-landing template: cover, TOC, marquee, ledger,\n   sticky-scroll narrative, horizontal scroll, marginalia, colophon\n   =================================================================== */\n\n/* ---- 12-col grid helpers ---- */\n.grid-12 {\n  display: grid;\n  grid-template-columns: repeat(12, 1fr);\n  gap: 32px;\n}\n.col-1-3  { grid-column: 1 / 4; }\n.col-1-4  { grid-column: 1 / 5; }\n.col-1-5  { grid-column: 1 / 6; }\n.col-1-6  { grid-column: 1 / 7; }\n.col-1-7  { grid-column: 1 / 8; }\n.col-2-12 { grid-column: 2 / 13; }\n.col-3-9  { grid-column: 3 / 10; }\n.col-3-11 { grid-column: 3 / 12; }\n.col-4-12 { grid-column: 4 / 13; }\n.col-5-12 { grid-column: 5 / 13; }\n.col-6-12 { grid-column: 6 / 13; }\n.col-7-12 { grid-column: 7 / 13; }\n.col-8-12 { grid-column: 8 / 13; }\n.col-9-12 { grid-column: 9 / 13; }\n.col-span-12 { grid-column: 1 / -1; }\n@media (max-width: 900px) {\n  .grid-12 { grid-template-columns: 1fr; gap: 24px; }\n  [class*=\"col-\"] { grid-column: 1 / -1 !important; }\n}\n\n/* ---- COVER ---- */\n.cover {\n  background: var(--rp-black);\n  color: #fff;\n  min-height: 100vh;\n  display: grid;\n  grid-template-rows: auto 1fr auto;\n  padding: 110px var(--pad-x) 0;\n  position: relative;\n  overflow: hidden;\n}\n.cover::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(800px 600px at 90% 10%, rgba(227,6,19,0.25), transparent 60%),\n    radial-gradient(600px 600px at 0% 100%, rgba(227,6,19,0.12), transparent 60%);\n  pointer-events: none;\n}\n.cover .wrap { position: relative; z-index: 1; max-width: var(--container); margin: 0 auto; width: 100%; }\n\n.cover-meta {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 24px;\n  padding-bottom: 32px;\n  border-bottom: 1px solid rgba(255,255,255,0.12);\n}\n.cover-meta .item .l {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.45);\n  margin-bottom: 6px;\n}\n.cover-meta .item .v {\n  font-family: var(--mono);\n  font-size: 13px;\n  color: #fff;\n  font-weight: 500;\n  letter-spacing: 0.04em;\n}\n.cover-meta .item .v.red { color: var(--rp-red); }\n@media (max-width: 700px) { .cover-meta { grid-template-columns: 1fr; gap: 16px; padding-bottom: 24px; } }\n\n.cover-body {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  padding: 80px 0;\n}\n.cover-no {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  color: var(--rp-red);\n  margin-bottom: 32px;\n}\n.cover-title {\n  font-size: clamp(56px, 11vw, 200px);\n  font-weight: 800;\n  line-height: 0.88;\n  letter-spacing: -0.045em;\n  margin: 0;\n  text-wrap: balance;\n}\n.cover-title .alt {\n  display: block;\n  color: rgba(255,255,255,0.42);\n  font-weight: 500;\n}\n.cover-title em {\n  font-style: normal;\n  color: var(--rp-red);\n  /* inline-block to allow indent */\n}\n.cover-thesis {\n  margin-top: 80px;\n  max-width: 720px;\n  margin-left: auto;\n  font-size: clamp(18px, 1.6vw, 22px);\n  line-height: 1.55;\n  color: rgba(255,255,255,0.78);\n  position: relative;\n  padding-left: 32px;\n}\n.cover-thesis::before {\n  content: \"\";\n  position: absolute;\n  left: 0; top: 8px; bottom: 8px;\n  width: 2px;\n  background: var(--rp-red);\n}\n.cover-thesis .author {\n  display: block;\n  margin-top: 18px;\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.5);\n}\n\n.cover-foot {\n  padding: 32px 0;\n  border-top: 1px solid rgba(255,255,255,0.12);\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.55);\n}\n.cover-foot .scroll {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n}\n.cover-foot .scroll::after {\n  content: \"↓\";\n  display: inline-block;\n  animation: bob 1.6s ease-in-out infinite;\n}\n\n/* ---- MARQUEE TICKER ---- */\n.marquee {\n  background: var(--rp-red);\n  color: #fff;\n  padding: 16px 0;\n  overflow: hidden;\n  position: relative;\n  border-top: 1px solid rgba(0,0,0,0.1);\n  border-bottom: 1px solid rgba(0,0,0,0.1);\n}\n.marquee-track {\n  display: flex;\n  gap: 80px;\n  white-space: nowrap;\n  animation: marquee 50s linear infinite;\n  font-family: var(--mono);\n  font-size: 13px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  font-weight: 500;\n}\n.marquee-track span {\n  display: inline-flex;\n  align-items: center;\n  gap: 16px;\n}\n.marquee-track span::after {\n  content: \"✦\";\n  margin-left: 80px;\n  color: rgba(255,255,255,0.4);\n}\n.marquee:hover .marquee-track { animation-play-state: paused; }\n@keyframes marquee {\n  from { transform: translateX(0); }\n  to   { transform: translateX(-50%); }\n}\n\n/* ---- TABLE OF CONTENTS ---- */\n.toc {\n  padding: 120px var(--pad-x);\n  background: var(--bg);\n  border-bottom: 1px solid var(--line);\n}\n.toc .wrap { max-width: var(--container); margin: 0 auto; }\n.toc-head {\n  display: grid;\n  grid-template-columns: 240px 1fr;\n  gap: 80px;\n  padding-bottom: 48px;\n  margin-bottom: 32px;\n  border-bottom: 1px solid var(--line);\n}\n.toc-head .l {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--rp-red);\n  font-weight: 600;\n}\n.toc-head .t {\n  font-size: clamp(28px, 3vw, 44px);\n  font-weight: 700;\n  letter-spacing: -0.02em;\n  line-height: 1.1;\n  margin: 0;\n  text-wrap: balance;\n}\n.toc-list {\n  display: flex;\n  flex-direction: column;\n}\n.toc-row {\n  display: grid;\n  grid-template-columns: 56px 1fr 240px 80px;\n  gap: 24px;\n  align-items: baseline;\n  padding: 22px 0;\n  border-bottom: 1px solid var(--line);\n  transition: padding-left 200ms, color 200ms, background 200ms;\n  position: relative;\n}\n.toc-row:hover {\n  padding-left: 16px;\n  background: linear-gradient(90deg, rgba(227,6,19,0.04), transparent 30%);\n}\n.toc-row .tn {\n  font-family: var(--mono);\n  font-size: 13px;\n  color: var(--rp-red);\n  font-weight: 600;\n  letter-spacing: 0.04em;\n}\n.toc-row .tt {\n  font-size: clamp(22px, 2.2vw, 32px);\n  font-weight: 700;\n  letter-spacing: -0.015em;\n  line-height: 1.15;\n  color: var(--ink);\n}\n.toc-row:hover .tt { color: var(--rp-red); }\n.toc-row .ts {\n  font-size: 14px;\n  color: var(--ink-3);\n  line-height: 1.4;\n}\n.toc-row .tp {\n  font-family: var(--mono);\n  font-size: 13px;\n  color: var(--ink-3);\n  text-align: right;\n  letter-spacing: 0.06em;\n  position: relative;\n}\n.toc-row .tp::before {\n  content: \"→\";\n  position: absolute;\n  left: -22px;\n  color: var(--rp-red);\n  opacity: 0;\n  transition: opacity 200ms, transform 200ms;\n}\n.toc-row:hover .tp::before { opacity: 1; transform: translateX(4px); }\n@media (max-width: 1100px) {\n  .toc-head { grid-template-columns: 1fr; gap: 24px; }\n  .toc-row { grid-template-columns: 40px 1fr; }\n  .toc-row .ts, .toc-row .tp { grid-column: 2; }\n  .toc-row .tp { text-align: left; padding-top: 6px; font-size: 11px; }\n}\n\n/* ---- CHAPTER OPENING ---- */\n.chap-open {\n  padding: 200px var(--pad-x) 80px;\n  position: relative;\n}\n.chap-open .wrap { max-width: var(--container); margin: 0 auto; }\n.chap-open .chap-no {\n  font-family: var(--mono);\n  font-size: 12px;\n  letter-spacing: 0.24em;\n  color: var(--rp-red);\n  font-weight: 600;\n  margin-bottom: 32px;\n}\n.chap-open .chap-no::before {\n  content: \"—— \";\n  letter-spacing: 0;\n}\n.chap-open h2 {\n  font-size: clamp(48px, 7vw, 120px);\n  font-weight: 800;\n  line-height: 0.92;\n  letter-spacing: -0.04em;\n  margin: 0;\n  text-wrap: balance;\n}\n.chap-open h2 em { font-style: normal; color: var(--rp-red); }\n.chap-open .chap-intro {\n  margin-top: 40px;\n  max-width: 720px;\n  font-size: clamp(18px, 1.4vw, 22px);\n  line-height: 1.55;\n  color: var(--ink-2);\n}\n.chap-open.dark { background: var(--rp-black); color: #fff; }\n.chap-open.dark h2 { color: #fff; }\n.chap-open.dark .chap-intro { color: rgba(2 ns: 30px 1fr;\n  gap: 12px;\n  color: rgba(255,255,255,0.78);\n  font-size: 14px;\n  padding: 4px 0;\n}\n.col-bottom .index-list a .nn { color: var(--rp-red); font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }\n.col-bottom .index-list a:hover { color: var(--rp-red); }\n\n.col-foot {\n  margin-top: 64px;\n  padding-top: 32px;\n  border-top: 1px solid rgba(255,255,255,0.1);\n  display: flex;\n  justify-content: space-between;\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.4);\n}\n@media (max-width: 900px) {\n  .col-bottom { grid-template-columns: 1fr; gap: 32px; }\n  .col-foot { flex-direction: column; gap: 12px; }\n}\n\n/* ---- SECTION PROGRESS (right rail) ---- */\n.progress-rail {\n  position: fixed;\n  right: 32px;\n  top: 50%;\n  transform: translateY(-50%);\n  z-index: 50;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity 300ms ease;\n}\n.progress-rail.show { opacity: 1; pointer-events: auto; }\n.progress-rail a {\n  position: relative;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: 0.16em;\n  color: var(--ink-3);\n  padding: 4px 0;\n}\n.progress-rail a .dot {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  background: var(--line-2);\n  transition: background 200ms, transform 200ms;\n}\n.progress-rail a .lbl {\n  opacity: 0;\n  transition: opacity 200ms;\n  pointer-events: none;\n}\n.progress-rail a:hover .lbl { opacity: 1; }\n.progress-rail a:hover .dot, .progress-rail a.active .dot {\n  background: var(--rp-red);\n  transform: scale(1.4);\n}\n.progress-rail a.active .lbl { opacity: 1; color: var(--rp-red); }\n@media (max-width: 1200px) { .progress-rail { display: none; } }\n\n/* ---- PULL QUOTE breaks ---- */\n.pullquote-break {\n  padding: 100px var(--pad-x);\n  background: var(--bg-2);\n  text-align: center;\n}\n.pullquote-break .pq {\n  max-width: 900px;\n  margin: 0 auto;\n  font-size: clamp(28px, 3.5vw, 52px);\n  font-weight: 700;\n  letter-spacing: -0.02em;\n  line-height: 1.1;\n  color: var(--ink);\n  text-wrap: balance;\n  position: relative;\n}\n.pullquote-break .pq em { font-style: normal; color: var(--rp-red); }\n.pullquote-break .pq::before, .pullquote-break .pq::after {\n  content: \"—\";\n  display: block;\n  width: 56px;\n  height: 2px;\n  background: var(--rp-red);\n  margin: 0 auto 32px;\n}\n.pullquote-break .pq::after { margin: 32px auto 0; }\n<\u002Fstyle>\n\n<script>document.documentElement.classList.remove('no-js'); document.documentElement.classList.add('js');<\u002Fscript>\n<\u002Fhead>\n<body>\n\n<!-- ============ FLOATING NAV (minimal) ============ -->\n<nav class=\"nav\">\n  <div class=\"wrap\">\n    <a href=\"#cover\" class=\"nav-brand\">\n      <span class=\"mark\">A<\u002Fspan>\n      ASYSTEM <span style=\"color:var(--ink-3); font-weight:400;\">×<\u002Fspan> RP\n    <\u002Fa>\n    <div class=\"nav-links\">\n      <a href=\"#toc\">Содержание<\u002Fa>\n      <a href=\"#ch-04\">Разрывы<\u002Fa>\n      <a href=\"#ch-06\">Модули<\u002Fa>\n      <a href=\"#ch-08\">Эффект<\u002Fa>\n    <\u002Fdiv>\n    <a href=\"#colophon\" class=\"nav-cta\">\n      Встреча <span class=\"arr\">→<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ============ COVER (Document opening) ============ -->\n<header class=\"cover\" id=\"cover\">\n  <div class=\"wrap\">\n    <div class=\"cover-meta\">\n      <div class=\"item\">\n        <div class=\"l\">Документ<\u002Fdiv>\n        <div class=\"v red\">01 / 2026 · DRAFT<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"item\">\n        <div class=\"l\">Тема<\u002Fdiv>\n        <div class=\"v\">Единая корпоративная экосистема<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"item\">\n        <div class=\"l\">Подготовил<\u002Fdiv>\n        <div class=\"v\">ASYSTEM · Бишкек<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cover-body\">\n      <div class=\"cover-no\">№ 01 — Концепция · Конфиденциально<\u002Fdiv>\n      <h1 class=\"cover-title\">\n        Red Petroleum<br>\n        <span class=\"alt\">— это не сеть АЗС.<\u002Fspan><br>\n        <em>Это<\u002Fem> технологическая<br>\n        компания, которая ещё<br>\n        <span class=\"alt\">не знает этого.<\u002Fspan>\n      <\u002Fh1>\n      <div class=\"cover-thesis\">\n        Доля&nbsp;&gt;50% рынка ГСМ. ~3,8&nbsp;млрд налогов в&nbsp;бюджет. 200+&nbsp;АЗС. Первая нефтетрейдинговая компания на&nbsp;бирже&nbsp;КР. Сеть&nbsp;ЭЗС, RedPay, RedStaff, OCPP-инфраструктура. Группа уже работает как&nbsp;технологический холдинг — но&nbsp;данные, процессы и&nbsp;решения живут в&nbsp;разных контурах. Этот документ показывает, как&nbsp;единая платформа консолидирует масштаб группы в&nbsp;управляемый актив.\n        <span class=\"author\">— Подготовлено ASYSTEM · Май 2026<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cover-foot\">\n      <span>Альфа Ойл / Red Petroleum group<\u002Fspan>\n      <span class=\"scroll\">Открыть документ<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ MARQUEE — public facts ============ -->\n<div class=\"marquee\">\n  <div class=\"marquee-track\">\n    <span>&gt;50% доля рынка ГСМ КР<\u002Fspan>\n    <span>~3,8 млрд сомов налогов в год<\u002Fspan>\n    <span>200+ АЗС в 7 регионах<\u002Fspan>\n    <span>100 млн KGS облигаций · 18% · 3 года<\u002Fspan>\n    <span>$36 млн кредит на модернизацию<\u002Fspan>\n    <span>3 800+ госконтрактов поставки топлива<\u002Fspan>\n    <span>Первая нефтетрейдинговая на бирже КР<\u002Fspan>\n    <span>OCPP-сервер 1.6 / 2.0.1<\u002Fspan>\n    <!-- duplicate for seamless loop -->\n    <span>&gt;50% доля рынка ГСМ КР<\u002Fspan>\n    <span>~3,8 млрд сомов налогов в год<\u002Fspan>\n    <span>200+ АЗС в 7 регионах<\u002Fspan>\n    <span>100 млн KGS облигаций · 18% · 3 года<\u002Fspan>\n    <span>$36 млн кредит на модернизацию<\u002Fspan>\n    <span>3 800+ госконтрактов поставки топлива<\u002Fspan>\n    <span>Первая нефтетрейдинговая на бирже КР<\u002Fspan>\n    <span>OCPP-сервер 1.6 / 2.0.1<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ TABLE OF CONTENTS ============ -->\n<section class=\"toc\" id=\"toc\">\n  <div class=\"wrap\">\n    <div class=\"toc-head\">\n      <div class=\"l\">Содержание<br>документа<\u002Fdiv>\n      <h2 class=\"t\">9 глав, читается за&nbsp;12&nbsp;минут.<br>Можно начать с&nbsp;любой.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"toc-list\">\n      <a class=\"toc-row\" href=\"#ch-01\">\n        <span class=\"tn\">01<\u002Fspan>\n        <span class=\"tt\">Тезис<\u002Fspan>\n        <span class=\"ts\">Почему «технологическая компания» — это не&nbsp;метафора<\u002Fspan>\n        <span class=\"tp\">2 мин →<\u002Fspan>\n      <\u002Fa>\n      <a class=\"toc-row\" href=\"#ch-02\">\n        <span class=\"tn\">02<\u002Fspan>\n        <span class=\"tt\">Стартовая точка<\u002Fspan>\n        <span class=\"ts\">Шесть фактов, которые описывают сегодняшний масштаб<\u002Fspan>\n        <span class=\"tp\">2 мин →<\u002Fspan>\n      <\u002Fa>\n      <a class=\"toc-row\" href=\"#ch-03\">\n        <span class=\"tn\">03<\u002Fspan>\n        <span class=\"tt\">Структура группы<\u002Fspan>\n        <span class=\"ts\">Три юр.лица, цепочка от&nbsp;импорта до&nbsp;розницы<\u002Fspan>\n        <span class=\"tp\">1 мин →<\u002Fspan>\n      <\u002Fa>\n      <a class=\"toc-row\" href=\"#ch-04\">\n        <span class=\"tn\">04<\u002Fspan>\n        <span class=\"tt\">Одиннадцать трений<\u002Fspan>\n        <span class=\"ts\">Точки разрыва между контурами. Ledger для&nbsp;Discovery<\u002Fspan>\n        <span class=\"tp\">3 мин →<\u002Fspan>\n      <\u002Fa>\n      <a class=\"toc-row\" href=\"#ch-05\">\n        <span class=\"tn\">05<\u002Fspan>\n        <span class=\"tt\">Манифест<\u002Fspan>\n        <span class=\"ts\">Три столпа единой экосистемы<\u002Fspan>\n        <span class=\"tp\">1 мин →<\u002Fspan>\n      <\u002Fa>\n      <a class=\"toc-row\" href=\"#ch-06\">\n        <span class=\"tn\">06<\u002Fspan>\n        <span class=\"tt\">Четыре модуля<\u002Fspan>\n        <span class=\"ts\">Из чего собирается экосистема. Горизонтальный разворот<\u002Fspan>\n        <span class=\"tp\">3 мин →<\u002Fspan>\n      <\u002Fa>\n      <a class=\"toc-row\" href=\"#ch-07\">\n        <span class=\"tn\">07<\u002Fspan>\n        <span class=\"tt\">Восемнадцать месяцев<\u002Fspan>\n        <span class=\"ts\">Дорожная карта: пять этапов, поэтапные результаты<\u002Fspan>\n        <span class=\"tp\">1 мин →<\u002Fspan>\n      <\u002Fa>\n      <a class=\"toc-row\" href=\"#ch-08\">\n        <span class=\"tn\">08<\u002Fspan>\n        <span class=\"tt\">Цифры<\u002Fspan>\n        <span class=\"ts\">Эффект в&nbsp;деньгах. Симулятор для&nbsp;ваших параметров<\u002Fspan>\n        <span class=\"tp\">2 мин →<\u002Fspan>\n      <\u002Fa>\n      <a class=\"toc-row\" href=\"#ch-09\">\n        <span class=\"tn\">09<\u002Fspan>\n        <span class=\"tt\">Подпись<\u002Fspan>\n        <span class=\"ts\">Почему ASYSTEM, на&nbsp;каких условиях<\u002Fspan>\n        <span class=\"tp\">1 мин →<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CHAPTER 01 — ТЕЗИС (pull quote break) ============ -->\n<section class=\"chap-open\" id=\"ch-01\">\n  <div class=\"wrap\">\n    <div class=\"chap-no\">Глава 01 — Тезис<\u002Fdiv>\n    <h2>Сеть АЗС, которая нечаянно<br>стала <em>технологической&nbsp;компанией.<\u002Fem><\u002Fh2>\n    <p class=\"chap-intro dropcap\">\n      Вертикально-интегрированный холдинг с&nbsp;финансовой публичностью, EV-направлением, мобильным приложением и&nbsp;B2B-контурами. Каждый из&nbsp;этих контуров уже создан и&nbsp;работает. Не&nbsp;создан только один — контур, который объединяет всё остальное. Этот документ — про&nbsp;него.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"pullquote-break\">\n  <div class=\"pq\">«Группа уже работает как&nbsp;технологический холдинг — <em>но&nbsp;данные живут в&nbsp;разных контурах.»<\u002Fem><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ CHAPTER 02 — СТАРТОВАЯ ТОЧКА (sticky-scroll narrative) ============ -->\n<section class=\"chap-open\" id=\"ch-02\">\n  <div class=\"wrap\">\n    <div class=\"chap-no\">Глава 02 — Стартовая точка<\u002Fdiv>\n    <h2>Шесть фактов<br>из&nbsp;открытых&nbsp;источников.<\u002Fh2>\n    <p class=\"chap-intro\">\n      Каждый факт — публично подтверждён или&nbsp;следует из&nbsp;договора ASYSTEM. Это масштаб, на&nbsp;который опирается всё остальное в&nbsp;этом документе.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sticky-narrative\">\n  <div class=\"wrap\">\n    <div class=\"sn-grid\">\n      <div class=\"sn-left\">\n        <div class=\"ll\">02.0 · Что у вас уже работает<\u002Fdiv>\n        <div class=\"tt\">Не сеть АЗС.<br>Холдинг.<\u002Fdiv>\n        <div class=\"dd\">Шесть слоёв инфраструктуры, каждый — отдельный продукт, который вы уже эксплуатируете. Прокрутите вниз → факты расширяются по&nbsp;одному.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"sn-right\">\n        <div class=\"fact-block\">\n          <div class=\"fl\"><span class=\"num\">02.1<\u002Fspan><span>МАСШТАБ<\u002Fspan><\u002Fdiv>\n          <div class=\"ft\">Сеть из&nbsp;200+ АЗС<\u002Fdiv>\n          <div class=\"fb\"><strong>7&nbsp;регионов Кыргызстана:<\u002Fstrong> Чуйская, Иссык-Кульская, Нарынская, Ошская, Баткенская, Джалал-Абадская, Таласская. 10+&nbsp;видов топлива стандарта Евро-5.<\u002Fdiv>\n          <div class=\"footnote\">Источник: AmCham&nbsp;KG · официальный сайт Red&nbsp;Petroleum<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fact-block\">\n          <div class=\"fl\"><span class=\"num\">02.2<\u002Fspan><span>КЛИЕНТСКИЙ СЛОЙ<\u002Fspan><\u002Fdiv>\n          <div class=\"ft\">RedPay — лояльность<\u002Fdiv>\n          <div class=\"fb\">Программа лояльности и&nbsp;мобильное приложение для&nbsp;розничного клиента: <strong>кэшбэк, бонусы, оплата.<\u002Fstrong> Подтверждено публикациями AmCham и&nbsp;официальным сайтом.<\u002Fdiv>\n          <div class=\"footnote\">Источник: AmCham&nbsp;KG публикация о&nbsp;RedPay<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fact-block\">\n          <div class=\"fl\"><span class=\"num\">02.3<\u002Fspan><span>EV-НАПРАВЛЕНИЕ<\u002Fspan><\u002Fdiv>\n          <div class=\"ft\">RedCharge + OCPP<\u002Fdiv>\n          <div class=\"fb\">Сеть электрозарядных станций с&nbsp;<strong>OCPP-сервером 1.6&nbsp;/&nbsp;2.0.1,<\u002Fstrong> разработанным ASYSTEM. Стратегическое направление — указано как&nbsp;цель биржевого размещения.<\u002Fdiv>\n          <div class=\"footnote\">Источник: действующий договор ASYSTEM × ОсОО «Альфа Ойл»<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fact-block\">\n          <div class=\"fl\"><span class=\"num\">02.4<\u002Fspan><span>B2B<\u002Fspan><\u002Fdiv>\n          <div class=\"ft\">Опт + госконтракты<\u002Fdiv>\n          <div class=\"fb\">Альфа&nbsp;Петролеум — оптовая торговля с&nbsp;<strong>30+ корпоративными клиентами.<\u002Fstrong> Госконтракты 2015—2020: <strong>3&nbsp;800+ контрактов<\u002Fstrong> поставки топлива на&nbsp;1+&nbsp;млрд&nbsp;сомов.<\u002Fdiv>\n          <div class=\"footnote\">Источник: реестр госзакупок КР · Akchabar<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fact-block\">\n          <div class=\"fl\"><span class=\"num\">02.5<\u002Fspan><span>ФИНАНСЫ<\u002Fspan><\u002Fdiv>\n          <div class=\"ft\">Биржа + госкредит<\u002Fdiv>\n          <div class=\"fb\"><strong>100&nbsp;млн&nbsp;KGS облигаций<\u002Fstrong> под&nbsp;18%, первая нефтетрейдинговая компания на&nbsp;бирже&nbsp;КР. <strong>$36&nbsp;млн кредит<\u002Fstrong> от&nbsp;ОАО «Элдик Банк» под&nbsp;7% на&nbsp;3 года с&nbsp;льготным периодом 21&nbsp;мес.<\u002Fdiv>\n          <div class=\"footnote\">Источник: Kaktus.media · Gazeta.kg · Akchabar<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fact-block\">\n          <div class=\"fl\"><span class=\"num\">02.6<\u002Fspan><span>ИТ-СТЕК<\u002Fspan><\u002Fdiv>\n          <div class=\"ft\">1С + Bitrix + RedStaff<\u002Fdiv>\n          <div class=\"fb\"><strong>1С:ЗУП<\u002Fstrong> для&nbsp;HR и&nbsp;зарплаты. <strong>Bitrix24<\u002Fstrong> для&nbsp;управления задачами. <strong>RedStaff Этап&nbsp;1<\u002Fstrong> — собственный HR-портал. OCPP-сервер. Мобильное приложение RedPay.<\u002Fdiv>\n          <div class=\"footnote\">Источник: ТЗ&nbsp;RedStaff Этап&nbsp;2 · договор RedCharge<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CHAPTER 03 — ГРУППА (12-col spread) ============ -->\n<section class=\"chap-open\" id=\"ch-03\">\n  <div class=\"wrap\">\n    <div class=\"chap-no\">Глава 03 — Структура группы<\u002Fdiv>\n    <h2>Три юрлица.<br>Одна <em>цепочка поставок.<\u002Fem><\u002Fh2>\n    <p class=\"chap-intro\">\n      Каждое юр.лицо закрывает свою функцию: импорт, опт, розница. Правильная инженерная декомпозиция бизнеса. Но&nbsp;операционные данные между&nbsp;ними сегодня связаны через ручные процессы — и&nbsp;в&nbsp;этом главный резерв для&nbsp;технологической надстройки.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"group-spread\">\n  <div class=\"wrap\">\n    <div class=\"gs-grid\">\n      <!-- Three entities on asymmetric columns -->\n      <div class=\"gs-card col-1-4\">\n        <span class=\"role\">Импорт<\u002Fspan>\n        <div class=\"name\">ОсОО «Биорг&nbsp;Ойл»<\u002Fdiv>\n        <div class=\"addr\">Внешнеэкономическая деятельность<\u002Fdiv>\n        <div class=\"desc\">Закупка и&nbsp;ввоз нефтепродуктов с&nbsp;российских&nbsp;НПЗ. Точка входа сырья в&nbsp;группу.<\u002Fdiv>\n        <div class=\"source\">Источник данных →<br>объёмы импорта · контракты · качество партий · логистика до&nbsp;нефтебазы<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gs-card col-5-12\" style=\"grid-column: 5 / 9;\">\n        <span class=\"role\">Опт · B2B<\u002Fspan>\n        <div class=\"name\">Альфа&nbsp;Петролеум&nbsp;LLC<\u002Fdiv>\n        <div class=\"addr\">Бишкек, ул. Панфилова 188/2<\u002Fdiv>\n        <div class=\"desc\">Оптовая торговля для&nbsp;30+ корпоративных покупателей. ДТ, бензин, СНГ, реактивное топливо, мазут, битум. Госконтракты.<\u002Fdiv>\n        <div class=\"source\">Источник данных →<br>договоры B2B · тендеры · контроль исполнения · цены и&nbsp;условия<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gs-card\" style=\"grid-column: 9 / 13;\">\n        <span class=\"role\">Розница<\u002Fspan>\n        <div class=\"name\">ОсОО «Альфа&nbsp;Ойл»<\u002Fdiv>\n        <div class=\"addr\">Бишкек, БЦ «Альфа Ойл», Жумабека 105/1<\u002Fdiv>\n        <div class=\"desc\">Бренд&nbsp;Red&nbsp;Petroleum: сеть АЗС, RedPay, ЭЗС, колл-центр, магазины при&nbsp;АЗС. Контрагент в&nbsp;действующем договоре RedCharge.<\u002Fdiv>\n        <div class=\"source\">Источник данных →<br>продажи розницы · клиент RedPay · сессии ЭЗС · персонал АЗС<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Full-width flow diagram -->\n      <div class=\"gs-flow\">\n        <div class=\"inner\">\n          <div class=\"ftitle\">Как движется сырьё и&nbsp;деньги по&nbsp;группе<\u002Fdiv>\n          <div class=\"flow-row\">\n            <div class=\"flow-node\">\n              <span class=\"ll\">Поставщики<\u002Fspan>\n              <span class=\"nn\">Российские НПЗ<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"flow-arrow\"><\u002Fdiv>\n            <div class=\"flow-node\">\n              <span class=\"ll\">Импорт<\u002Fspan>\n              <span class=\"nn\">ОсОО «Биорг Ойл»<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"flow-arrow\"><\u002Fdiv>\n            <div class=\"flow-node red\">\n              <span class=\"ll\">Хранение<\u002Fspan>\n              <span class=\"nn\">Нефтебазы группы<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"flow-fork\">\n              <div class=\"flow-side\">\n                <div class=\"flow-node\">\n                  <span class=\"ll\">Опт · B2B<\u002Fspan>\n                  <span class=\"nn\">Альфа Петролеум<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"flow-leaf\">30+ корпоративных клиентов<\u002Fdiv>\n                <div class=\"flow-leaf\">3 800+ госконтрактов<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"flow-side\">\n                <div class=\"flow-node\">\n                  <span class=\"ll\">Розница<\u002Fspan>\n                  <span class=\"nn\">Альфа Ойл · Red Petroleum<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"flow-leaf\">200+ АЗС в 7 регионах<\u002Fdiv>\n                <div class=\"flow-leaf\">RedPay · розничный клиент<\u002Fdiv>\n                <div class=\"flow-leaf\">RedCharge OCPP · ЭЗС<\u002Fdiv>\n                <div class=\"flow-leaf\">B2B-портал · корпоративные<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"flow-finance\">\n            <div class=\"fin-card\">\n              <div class=\"ll\">Биржа КР ↔ Альфа Ойл<\u002Fdiv>\n              <div class=\"nn\">100 млн KGS облигации<\u002Fdiv>\n              <div class=\"ss\">18% · 3 года<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"fin-card\">\n              <div class=\"ll\">Элдик Банк ↔ Альфа Ойл<\u002Fdiv>\n              <div class=\"nn\">$36 млн кредит<\u002Fdiv>\n              <div class=\"ss\">7% · 3 года · льгот. 21 мес<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"fin-card\">\n              <div class=\"ll\">Группа → ГНС КР<\u002Fdiv>\n              <div class=\"nn\">~3,769 млрд сомов<\u002Fdiv>\n              <div class=\"ss\">налогов в год<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CHAPTER 04 — 11 ТРЕНИЙ (Ledger) ============ -->\n<section class=\"chap-open dark\" id=\"ch-04\">\n  <div class=\"wrap\">\n    <div class=\"chap-no\">Глава 04 — Одиннадцать трений<\u002Fdiv>\n    <h2>Где сейчас<br><em>напряжение&nbsp;между&nbsp;контурами.<\u002Fem><\u002Fh2>\n    <p class=\"chap-intro\">\n      Это гипотезы для&nbsp;проверки на&nbsp;Discovery, а&nbsp;не&nbsp;подтверждённые факты. Часть зон описана в&nbsp;ТЗ&nbsp;RedStaff Этап&nbsp;2 (раздел&nbsp;2.1). Остальные — типовые точки разрыва для&nbsp;группы такого масштаба. Кликните строку слева — справа откроется детализация.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"ledger-section\">\n  <div class=\"wrap\">\n    <div class=\"ledger-grid\">\n      <div class=\"ledger-list\">\n        <div class=\"ledger-row active\" data-n=\"01\" data-badges=\"pub,hyp\" data-title=\"Три юр.лица группы\" data-body=\"Группа из трёх юр.лиц — публичный факт. Механика консолидации P&amp;L (ручная или автоматическая) — уточняется на Discovery.\" data-fix=\"Master Data Hub\">\n          <span class=\"lr-n\">01<\u002Fspan>\n          <div><span class=\"lr-t\">Три юр.лица группы<\u002Fspan><br><span class=\"lr-b pub\">✓ Публично<\u002Fspan> <span class=\"lr-b hyp\">⚑ Механика<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"02\" data-badges=\"tz\" data-title=\"1С:ЗУП vs RedStaff Этап 1\" data-body=\"Master-источник не зафиксирован → ошибки начислений при смене должности или увольнении сотрудника. Источник: ТЗ RedStaff Этап 2 раздел 2.1.\" data-fix=\"RedStaff Этап 2\">\n          <span class=\"lr-n\">02<\u002Fspan>\n          <div><span class=\"lr-t\">1С:ЗУП vs RedStaff Этап 1<\u002Fspan><br><span class=\"lr-b pub\">✓ Из ТЗ<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"03\" data-badges=\"hyp\" data-title=\"Колл-центр vs RedPay vs OCPP\" data-body=\"Оператор клиентского сервиса не видит статус ЭЗС в реальном времени и не может ответить про баланс RedPay — типовая ситуация при разделённых системах.\" data-fix=\"ИИ-ассистент клиента (Модуль B.2)\">\n          <span class=\"lr-n\">03<\u002Fspan>\n          <div><span class=\"lr-t\">Колл-центр vs RedPay vs OCPP<\u002Fspan><br><span class=\"lr-b hyp\">⚑ Гипотеза<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"04\" data-badges=\"hyp\" data-title=\"Табель операторов АЗС\" data-body=\"СКУД установлен не на всех точках → удалённые АЗС в 7 регионах ведут табель в Excel вне системы.\" data-fix=\"RedStaff Этап 3 (СКУД + GPS)\">\n          <span class=\"lr-n\">04<\u002Fspan>\n          <div><span class=\"lr-t\">Табель операторов АЗС<\u002Fspan><br><span class=\"lr-b hyp\">⚑ Гипотеза<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"05\" data-badges=\"hyp\" data-title=\"Тендеры на госплощадках\" data-body=\"Отдел закупок физически не успевает мониторить все релевантные тендеры → пропуски возможностей.\" data-fix=\"ИИ-агент тендеров (Модуль B.5)\">\n          <span class=\"lr-n\">05<\u002Fspan>\n          <div><span class=\"lr-t\">Тендеры на госплощадках<\u002Fspan><br><span class=\"lr-b hyp\">⚑ Гипотеза<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"06\" data-badges=\"hyp\" data-title=\"Сметы новых АЗС и ЭЗС\" data-body=\"Длительный цикл первичной сметы. При активной стратегии расширения сети это потенциально узкое место.\" data-fix=\"Сметный ИИ (Модуль B.6)\">\n          <span class=\"lr-n\">06<\u002Fspan>\n          <div><span class=\"lr-t\">Сметы новых АЗС и ЭЗС<\u002Fspan><br><span class=\"lr-b hyp\">⚑ Гипотеза<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"07\" data-badges=\"hyp\" data-title=\"Юридический отдел\" data-body=\"Договоры с поставщиками, B2B-клиентами, аренда участков под АЗС, страховщики — значительный объём для ручной обработки.\" data-fix=\"ИИ-юрист (Модуль B.4)\">\n          <span class=\"lr-n\">07<\u002Fspan>\n          <div><span class=\"lr-t\">Юридический отдел<\u002Fspan><br><span class=\"lr-b hyp\">⚑ Гипотеза<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"08\" data-badges=\"hyp\" data-title=\"Логистика топлива\" data-body=\"Точность прогноза спроса по каждой АЗС влияет на оптимальный уровень страховых запасов в резервуарах и оборачиваемость капитала.\" data-fix=\"ML прогноз спроса (Модуль B.7)\">\n          <span class=\"lr-n\">08<\u002Fspan>\n          <div><span class=\"lr-t\">Логистика топлива<\u002Fspan><br><span class=\"lr-b hyp\">⚑ Гипотеза<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"09\" data-badges=\"hyp\" data-title=\"Маркетинг RedPay\" data-body=\"Массовые акции для всей базы клиентов теряют эффективность по сравнению с персонализацией. Push без сегментации = отключения.\" data-fix=\"ИИ-маркетолог RedPay (Модуль B.8)\">\n          <span class=\"lr-n\">09<\u002Fspan>\n          <div><span class=\"lr-t\">Маркетинг RedPay<\u002Fspan><br><span class=\"lr-b hyp\">⚑ Гипотеза<\u002Fspan><\u002Fdiv>\n          <span class=\"lr-arr\">→<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ledger-row\" data-n=\"10\" data-badges=\"hyp\" data-title=\"EV-направление и поломки ЭЗС\" data-body=\"При реактивной модели обслуживания о поломке коннектора узнают через жалобу клиента. Для растущей EV-сети это репутационный риск.\" data-fix=\"ИИ-аналитик ЭЗС (Модуль B.9)\">\n          <span class=\"lr-n\">10<\u002Fspan>\n          <div><span class=\"lr-t\">EV персональные акции. Уход от&nbsp;«скидок всем».<\u002Fdiv><div class=\"foot\"><span class=\"term\">MVP 5 нед<\u002Fspan><span class=\"price\">900 000 KGS<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"ai-card\"><div class=\"ll\">B.9 · Аналитик ЭЗС<\u002Fdiv><div class=\"tt\">Предиктивное обслуживание<\u002Fdiv><div class=\"bb\">Предиктивное обслуживание ЭЗС поверх OCPP. Прогноз отказа за&nbsp;3—7&nbsp;дней.<\u002Fdiv><div class=\"foot\"><span class=\"term\">MVP 7 нед<\u002Fspan><span class=\"price\">1 000 000 KGS<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pack-row\">\n        <div class=\"pack-card\"><div><div class=\"ll\">Пакет «Бизнес» · 6 модулей<\u002Fdiv><div class=\"tt\">B.1 + B.2 + B.3 + B.4 + B.5 + B.7<\u002Fdiv><div class=\"dd\">8—12 недель<\u002Fdiv><\u002Fdiv><div class=\"pp\">4,3 млн&nbsp;KGS<\u002Fdiv><\u002Fdiv>\n        <div class=\"pack-card gold\"><div><div class=\"ll\">Пакет «Корпоратив» · все 9<\u002Fdiv><div class=\"tt\">Все 9 ИИ + 3 мес поддержки + обучение<\u002Fdiv><div class=\"dd\">14—18 недель<\u002Fdiv><\u002Fdiv><div class=\"pp\">6,2 млн&nbsp;KGS<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Module C: RedCharge Stage 3 -->\n    <div class=\"h-book\">\n      <div class=\"b-head\">\n        <div class=\"b-letter\">C<\u002Fdiv>\n        <div class=\"b-meta\">\n          <div class=\"ll\">EV · расширение + корпоративные тарифы<\u002Fdiv>\n          <div class=\"tt\">RedCharge — Этап 3<\u002Fdiv>\n          <div class=\"dd\">Развитие действующей EV-платформы: OCPI-роуминг, Plug&nbsp;&amp;&nbsp;Charge (ISO&nbsp;15118), корпоративные тарифы для&nbsp;B2B-флитов, расширенная аналитика загрузки сети, интеграция с&nbsp;RedPay-лояльностью.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"b-price\">\n          <div class=\"ll\">Срок<\u002Fdiv>\n          <div class=\"vv\">~4 мес<\u002Fdiv>\n          <div class=\"ss\">детализируется<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"h-subs\">\n        <div class=\"h-sub\">\n          <div class=\"ll\">C.1 · Роуминг и Plug&nbsp;&amp;&nbsp;Charge<\u002Fdiv>\n          <div class=\"tt\">OCPI 2.2.1 + ISO 15118-20<\u002Fdiv>\n          <ul>\n            <li>OCPI 2.2.1 для&nbsp;роуминга с&nbsp;Казахстаном, Узбекистаном<\u002Fli>\n            <li>ISO 15118-20 — Plug&nbsp;&amp;&nbsp;Charge (автоидентификация авто)<\u002Fli>\n            <li>Корпоративные тарифы и&nbsp;контракты для&nbsp;B2B-флитов<\u002Fli>\n          <\u002Ful>\n          <div class=\"ft\"><span class=\"term\">После scope<\u002Fspan><span class=\"price\">TBD<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"h-sub\">\n          <div class=\"ll\">C.2 · Аналитика и интеграция<\u002Fdiv>\n          <div class=\"tt\">Дашборд + RedPay<\u002Fdiv>\n          <ul>\n            <li>Дашборд загрузки сети и&nbsp;принятия решений по&nbsp;расширению<\u002Fli>\n            <li>Интеграция с&nbsp;RedPay для&nbsp;единого клиентского опыта<\u002Fli>\n            <li>Связь со&nbsp;страховщиками и&nbsp;аварийными службами<\u002Fli>\n          <\u002Ful>\n          <div class=\"ft\"><span class=\"term\">Доразработка<\u002Fspan><span class=\"price\">TBD<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Module D: Финансовый Hub -->\n    <div class=\"h-book\">\n      <div class=\"b-head\">\n        <div class=\"b-letter\">D<\u002Fdiv>\n        <div class=\"b-meta\">\n          <div class=\"ll\">Бухгалтерия · 1С · финансовый Hub<\u002Fdiv>\n          <div class=\"tt\">Финансовый контур<\u002Fdiv>\n          <div class=\"dd\">Глубокая интеграция RedCharge с&nbsp;1С:Бухгалтерия, фискализация всех зарядных сессий, ЭСФ, корпоративные счета. По&nbsp;мере раскрытия — расширение на&nbsp;всю группу: консолидация 3&nbsp;юр.лиц + автореконсиляция + биржевая отчётность.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"b-price\">\n          <div class=\"ll\">Срок<\u002Fdiv>\n          <div class=\"vv\">по&nbsp;брифу<\u002Fdiv>\n          <div class=\"ss\">определяется<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"h-subs\">\n        <div class=\"h-sub\">\n          <div class=\"ll\">D.1 · RedCharge-бухгалтерия<\u002Fdiv>\n          <div class=\"tt\">Учётный контур EV<\u002Fdiv>\n          <ul>\n            <li>Интеграция с&nbsp;1С:Бухгалтерия 8.3<\u002Fli>\n            <li>Автоматическая фискализация каждой зарядной сессии<\u002Fli>\n            <li>Электронные счёт-фактуры (ЭСФ) в&nbsp;систему ГНС<\u002Fli>\n            <li>Корпоративные тарифы и&nbsp;счета для&nbsp;B2B-клиентов<\u002Fli>\n            <li>Автореконсиляция с&nbsp;банками-эквайерами<\u002Fli>\n            <li>Подготовка отчётности под&nbsp;биржевые требования<\u002Fli>\n          <\u002Ful>\n          <div class=\"ft\"><span class=\"term\">После брифа<\u002Fspan><span class=\"price\">TBD<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"h-sub\">\n          <div class=\"ll\">D.2 · Расширение на&nbsp;группу<\u002Fdiv>\n          <div class=\"tt\">Консолидация по 3 юр.лицам<\u002Fdiv>\n          <ul>\n            <li>Консолидация бухгалтерского контура по&nbsp;3&nbsp;юр.лицам<\u002Fli>\n            <li>Единая отчётность для&nbsp;биржи и&nbsp;аудиторов<\u002Fli>\n            <li>Автоматизация межгрупповых сверок<\u002Fli>\n            <li>Налоговая отчётность как&nbsp;единая система<\u002Fli>\n            <li>Сквозная интеграция с&nbsp;RedStaff и&nbsp;RedCharge<\u002Fli>\n          <\u002Ful>\n          <div class=\"ft\"><span class=\"term\">После Discovery<\u002Fspan><span class=\"price\">TBD<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"pullquote-break\">\n  <div class=\"pq\">Рекомендованная последовательность —<br><em>A → D → B → C.<\u002Fem><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ CHAPTER 07 — ДОРОЖНАЯ КАРТА ============ -->\n<section class=\"chap-open\" id=\"ch-07\">\n  <div class=\"wrap\">\n    <div class=\"chap-no\">Глава 07 — Восемнадцать месяцев<\u002Fdiv>\n    <h2>От&nbsp;старта<br>до&nbsp;<em>полной экосистемы.<\u002Fem><\u002Fh2>\n    <p class=\"chap-intro\">\n      Поэтапное внедрение без&nbsp;шок-терапии. Каждые 3—6&nbsp;месяцев — рабочий результат, который окупается до&nbsp;начала следующего этапа. Никакого vendor lock-in: каждый модуль передаётся с&nbsp;исходным кодом, документацией и&nbsp;доступами.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"h-timeline\">\n  <div class=\"wrap\">\n    <div class=\"htl-rail\">\n      <div class=\"htl-step now\">\n        <div class=\"htl-dot\"><\u002Fdiv>\n        <div class=\"month\">Мес 1—3<\u002Fdiv>\n        <div class=\"nm\">Master Data Hub<br>(RedStaff Этап&nbsp;2)<\u002Fdiv>\n        <div class=\"ds\">1С master-режим, расширенный профиль, расчётный листок, миграция инфраструктуры на&nbsp;NSP.<\u002Fdiv>\n        <div class=\"pr\">32 000 USD<br><span style=\"color:var(--ink-3); font-weight:400;\">фундамент<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"htl-step\">\n        <div class=\"htl-dot\"><\u002Fdiv>\n        <div class=\"month\">Мес 4—6<\u002Fdiv>\n        <div class=\"nm\">Full Operational<br>(RedStaff Этап&nbsp;3)<\u002Fdiv>\n        <div class=\"ds\">Табель + СКУД + GPS, рейтинг, заявки, SSO в&nbsp;B2B, feature flags + read replica.<\u002Fdiv>\n        <div class=\"pr\">34 000 USD<br><span style=\"color:var(--ink-3); font-weight:400;\">HR закрыт<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"htl-step\">\n        <div class=\"htl-dot\"><\u002Fdiv>\n        <div class=\"month\">Мес 4—9 ‖<\u002Fdiv>\n        <div class=\"nm\">Финансовый Data Hub<br>(Модуль&nbsp;D)<\u002Fdiv>\n        <div class=\"ds\">Интеграция RedCharge с&nbsp;1С:Бухгалтерия, фискализация, ЭСФ, реконсиляция. Опционально — на&nbsp;группу.<\u002Fdiv>\n        <div class=\"pr\">после брифа<br><span style=\"color:var(--ink-3); font-weight:400;\">цена детализируется<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"htl-step\">\n        <div class=\"htl-dot\"><\u002Fdiv>\n        <div class=\"month\">Мес 6—12<\u002Fdiv>\n        <div class=\"nm\">Operational AI<br>(Модуль&nbsp;B)<\u002Fdiv>\n        <div class=\"ds\">Запуск 9&nbsp;ИИ-сотрудников волнами. «Бизнес» (6) → «Корпоратив» (9 + поддержка).<\u002Fdiv>\n        <div class=\"pr\">4,3 → 6,2 млн KGS<br><span style=\"color:var(--ink-3); font-weight:400;\">волнами<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"htl-step\">\n        <div class=\"htl-dot\"><\u002Fdiv>\n        <div class=\"month\">Мес 10—18<\u002Fdiv>\n        <div class=\"nm\">RedCharge Этап 3<br>(Модуль&nbsp;C)<\u002Fdiv>\n        <div class=\"ds\">OCPI-роуминг, Plug&nbsp;&amp;&nbsp;Charge, корпоративные тарифы B2B, расширенная аналитика загрузки.<\u002Fdiv>\n        <div class=\"pr\">опирается на A+D<br><span style=\"color:var(--ink-3); font-weight:400;\">EV-расширение<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CHAPTER 08 — ЦИФРЫ (Simulator focal) ============ -->\n<section class=\"chap-open dark\" id=\"ch-08\">\n  <div class=\"wrap\">\n    <div class=\"chap-no\">Глава 08 — Цифры<\u002Fdiv>\n    <h2>Что группа получает<br><em>в&nbsp;деньгах.<\u002Fem><\u002Fh2>\n    <p class=\"chap-intro\">\n      Все цифры — оценки по&nbsp;публично доступным данным о&nbsp;масштабе группы и&nbsp;типовым показателям отрасли. Финальные диапазоны фиксируются на&nbsp;Discovery с&nbsp;точными данными по&nbsp;штату, ФОТ, обороту и&nbsp;количеству операций.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"numbers\">\n  <div class=\"wrap\">\n    <!-- Simulator first — it's the focal point -->\n    <div class=\"simulator\">\n      <div>\n        <div class=\"sim-head\">\n          <div class=\"ll\">⚑ Модель · калибруется на Discovery<\u002Fdiv>\n          <div class=\"tt\">Симулятор<br>годовой&nbsp;экономии<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sim-controls\">\n          <div class=\"sim-row\">\n            <div class=\"top\"><span class=\"lbl\">Численность сотрудников<\u002Fspan><span class=\"val\" data-sim-v=\"employees\">300 чел.<\u002Fspan><\u002Fdiv>\n            <input type=\"range\" class=\"sim-slider\" data-sim=\"employees\" min=\"100\" max=\"2000\" step=\"10\" value=\"300\">\n            <div class=\"range-l\"><span>100<\u002Fspan><span>2 000<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sim-row\">\n            <div class=\"top\"><span class=\"lbl\">Месячный ФОТ группы, USD<\u002Fspan><span class=\"val\" data-sim-v=\"fot\">$120 000<\u002Fspan><\u002Fdiv>\n            <input type=\"range\" class=\"sim-slider\" data-sim=\"fot\" min=\"20000\" max=\"500000\" step=\"5000\" value=\"120000\">\n            <div class=\"range-l\"><span>$20k<\u002Fspan><span>$500k<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sim-row\">\n            <div class=\"top\"><span class=\"lbl\">Число АЗС в сети<\u002Fspan><span class=\"val\" data-sim-v=\"stations\">200 АЗС<\u002Fspan><\u002Fdiv>\n            <input type=\"range\" class=\"sim-slider\" data-sim=\"stations\" min=\"50\" max=\"500\" step=\"5\" value=\"200\">\n            <div class=\"range-l\"><span>50<\u002Fspan><span>500<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sim-row\">\n            <div class=\"top\"><span class=\"lbl\">Обращений клиентского сервиса в день<\u002Fspan><span class=\"val\" data-sim-v=\"requests\">400 / день<\u002Fspan><\u002Fdiv>\n            <input type=\"range\" class=\"sim-slider\" data-sim=\"requests\" min=\"50\" max=\"2000\" step=\"10\" value=\"400\">\n            <div class=\"range-l\"><span>50<\u002Fspan><span>2 000<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sim-row\">\n            <div class=\"top\"><span class=\"lbl\">Договоров юр.отдела в год<\u002Fspan><span class=\"val\" data-sim-v=\"contracts\">800 / год<\u002Fspan><\u002Fdiv>\n            <input type=\"range\" class=\"sim-slider\" data-sim=\"contracts\" min=\"100\" max=\"5000\" step=\"50\" value=\"800\">\n            <div class=\"range-l\"><span>100<\u002Fspan><span>5 000<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"sim-output\">\n        <div class=\"ll\">Оценка экономии в год<\u002Fdiv>\n        <div class=\"big-num\"><em data-sim-out=\"total\">$0<\u002Fem><\u002Fdiv>\n        <div class=\"sub-num\" data-sim-out=\"monthly\">$0 / мес<\u002Fdiv>\n        <div class=\"payback\">\n          <div>\n            <div class=\"ll\">Окупаемость RedStaff (Этапы 2+3, $66 000)<\u002Fdiv>\n            <div class=\"pv\" data-sim-out=\"payback\">— мес<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sim-disclaimer\">\n          Допущения: ошибки начисления ФОТ 0,3—1,0% при&nbsp;разделённых master-источниках · 30% времени HR на&nbsp;сверку (2—3 спец.) · юр.договоры по&nbsp;1,5ч · колл-центр 3 мин/обращение.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Impact callouts as marginalia under simulator -->\n    <div style=\"margin-top:64px;\">\n      <div class=\"marginalia-grid\">\n        <div class=\"marg\">\n          <div class=\"ll\">Откуда экономия<\u002Fdiv>\n          <div class=\"tt\">Четыре источника<br>возврата&nbsp;инвестиций.<\u002Fdiv>\n          <div class=\"dd\">Симулятор слева сводит эти четыре потока в&nbsp;единую цифру. Ниже — что именно складывается в&nbsp;неё.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"impact-grid\" style=\"margin-bottom:0;\">\n          <div class=\"impact-card\">\n            <div>\n              <div class=\"ll\">HR-контур<\u002Fdiv>\n              <div class=\"tt\">Master Data Hub + Full Coverage<\u002Fdiv>\n              <ul>\n                <li>Сокращение ошибок начисления зарплаты<\u002Fli>\n                <li>30% времени HR возвращается к&nbsp;стратегии<\u002Fli>\n                <li>Заявки: с&nbsp;дней до&nbsp;часов<\u002Fli>\n                <li>Антифрод в&nbsp;табеле удалённых АЗС<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div class=\"pull\">\n              <div class=\"pl\">Оценка / год<\u002Fdiv>\n              <div class=\"pv\">$23—38K<\u002Fdiv>\n              <div class=\"ps\">штат ~300 чел.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"impact-card\">\n            <div>\n              <div class=\"ll\">Operational AI<\u002Fdiv>\n              <div class=\"tt\">9 ИИ-сотрудников<\u002Fdiv>\n              <ul>\n                <li>Снижение нагрузки на&nbsp;клиентский сервис<\u002Fli>\n                <li>Анализ договоров в&nbsp;3—5 раз быстрее<\u002Fli>\n                <li>Сметы за&nbsp;часы вместо недель<\u002Fli>\n                <li>−20—30% страховых запасов<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div class=\"pull\">\n              <div class=\"pl\">Источник<\u002Fdiv>\n              <div class=\"pv\" style=\"font-size:18px; line-height:1.3;\">Discovery<br>по данным<\u002Fdiv>\n              <div class=\"ps\">калибруется<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"impact-card\">\n            <div>\n              <div class=\"ll\">Финансовый контур<\u002Fdiv>\n              <div class=\"tt\">Финансовый Data Hub<\u002Fdiv>\n              <ul>\n                <li>Автоматическая фискализация<\u002Fli>\n                <li>Реконсиляция без&nbsp;ручной сверки<\u002Fli>\n                <li>Единая отчётность для&nbsp;биржи<\u002Fli>\n                <li>Прозрачность P&amp;L по&nbsp;контурам<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div class=\"pull\">\n              <div class=\"pl\">Эффект<\u002Fdiv>\n              <div class=\"pv\" style=\"font-size:18px; line-height:1.3;\">Снижение<br>compliance<\u002Fdiv>\n              <div class=\"ps\">риск штрафов<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"impact-card\">\n            <div>\n              <div class=\"ll\">RedCharge Next<\u002Fdiv>\n              <div class=\"tt\">EV-расширение<\u002Fdiv>\n              <ul>\n                <li>OCPI-роуминг — KZ, UZ<\u002Fli>\n                <li>Корпоративные B2B-тарифы<\u002Fli>\n                <li>Plug &amp; Charge — удержание<\u002Fli>\n                <li>−2—3× downtime ЭЗС<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div class=\"pull\">\n              <div class=\"pl\">Эффект<\u002Fdiv>\n              <div class=\"pv\" style=\"font-size:18px; line-height:1.3;\">Защита EV<br>+ новые рынки<\u002Fdiv>\n              <div class=\"ps\">расширение базы<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CHAPTER 09 — ПОДПИСЬ ============ -->\n<section class=\"chap-open\" id=\"ch-09\">\n  <div class=\"wrap\">\n    <div class=\"chap-no\">Глава 09 — Подпись<\u002Fdiv>\n    <h2>Действующий партнёр,<br><em>не&nbsp;новый подрядчик.<\u002Fem><\u002Fh2>\n    <p class=\"chap-intro\">\n      Этот документ написан подрядчиком, который уже сдал и&nbsp;эксплуатирует один продукт в&nbsp;инфраструктуре Red&nbsp;Petroleum. Это меняет всё: сокращает Discovery, снижает риск на&nbsp;старте каждого модуля, убирает «знакомство» из&nbsp;бюджета.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"signature\">\n  <div class=\"wrap\">\n    <div class=\"sig-grid\">\n      <div class=\"sig-statement\">\n        ASYSTEM разработал OCPP-сервер для&nbsp;<em>зарядной инфраструктуры Red&nbsp;Petroleum<\u002Fem> в&nbsp;рамках действующего договора.\n        <span class=\"small\">Команда, регламенты и&nbsp;доверие — отлажены. Это и&nbsp;есть наша «верификация»: код, который уже работает в&nbsp;вашем контуре.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"sig-credentials\">\n        <div class=\"sig-cred\"><span class=\"cn\">01<\u002Fspan><div><div class=\"ct\">Доказанный кейс<\u002Fdiv><div class=\"cb\">RedCharge — действующий продукт, переданный в&nbsp;эксплуатацию. Тот&nbsp;же контрагент, тот&nbsp;же договорный контур.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"sig-cred\"><span class=\"cn\">02<\u002Fspan><div><div class=\"ct\">Локальная команда<\u002Fdiv><div class=\"cb\">Команда в&nbsp;Бишкеке. Выезды на&nbsp;объекты, поддержка на&nbsp;русском и&nbsp;кыргызском.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"sig-cred\"><span class=\"cn\">03<\u002Fspan><div><div class=\"ct\">50/50 оплата<\u002Fdiv><div class=\"cb\">50% после приёмки MVP, 50% после сдачи и&nbsp;передачи. Никаких авансов вслепую.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"sig-cred\"><span class=\"cn\">04<\u002Fspan><div><div class=\"ct\">Данные в&nbsp;КР<\u002Fdiv><div class=\"cb\">Серверы в&nbsp;Кыргызстане, коммерческие данные не&nbsp;уходят за&nbsp;рубеж. NDA до&nbsp;старта работ.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"sig-cred\"><span class=\"cn\">05<\u002Fspan><div><div class=\"ct\">Полная передача<\u002Fdiv><div class=\"cb\">Исходники, серверы, базы знаний, документация — Заказчику. Зависимости от&nbsp;подрядчика нет.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div class=\"sig-cred\"><span class=\"cn\">06<\u002Fspan><div><div class=\"ct\">Прозрачный процесс<\u002Fdiv><div class=\"cb\">Bitrix24 в&nbsp;реальном времени, еженедельные демо, акты приёмки по&nbsp;каждому подмодулю.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ COLOPHON (end-page + CTA + index) ============ -->\n<section class=\"colophon\" id=\"colophon\">\n  <div class=\"wrap\">\n    <div class=\"col-top\">\n      <div class=\"ll\">— Конец документа —<\u002Fdiv>\n      <h2>Встреча 30 минут.<br><em>Покажем демо.<\u002Fem><\u0
